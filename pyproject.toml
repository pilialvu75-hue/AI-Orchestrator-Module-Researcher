[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-orchestrator-module-researcher"
version = "0.1.0"
description = "Autonomous open-source module researcher for AI Orchestrator Module Library"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
researcher = "researcher.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["researcher"]
mypy_path = "src"
