name: Preflight release.update_manager background_downloader

on:
  push:
    branches:
      - preflight-release-background-downloader

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository 781flyingdutchman/background_downloader \
            --commit e3b88c4bdbc11fedca2a5c89bc3bba8d1bd539d1 \
            --source-version 9.6.1
