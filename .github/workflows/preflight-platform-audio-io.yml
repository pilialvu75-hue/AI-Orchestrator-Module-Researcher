name: Preflight platform.audio_io candidates

on:
  push:
    branches:
      - proof-platform-audio-io-v1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: flutter-webrtc
            repository: flutter-webrtc/flutter-webrtc
            commit: 964066f26f3303dd7d518cb86b8d76c8ee82b031
            release_tag: v1.6.2+hotfix.3
            source_version: 1.6.2+hotfix.3
          - label: audio-io
            repository: WAMF/audio_io
            commit: 47690f931422a2f58a0c4901133aba307e9649bf
            release_tag: v0.6.1
            source_version: 0.6.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-${{ matrix.label }}
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository "${{ matrix.repository }}" \
            --commit "${{ matrix.commit }}" \
            --release-tag "${{ matrix.release_tag }}" \
            --source-version "${{ matrix.source_version }}"
