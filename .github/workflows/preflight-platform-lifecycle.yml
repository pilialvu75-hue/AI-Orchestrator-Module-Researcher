name: Preflight platform.lifecycle candidates

on:
  push:
    branches:
      - proof-platform-lifecycle-v1

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: app-lifecycle-protector
            repository: huanguan1978/app_lifecycle_protector
            commit: 9a2ae9eafb88cfdb29a531fb824a3338eb1f74df
            source_version: 0.0.3
            component_path: ""
            release_tag: ""
          - id: lifecycle
            repository: chenenyu/lifecycle
            commit: 3c1f0b3b7e95f53017bc60e14f8fbba65f06bcf9
            source_version: 1.0.0
            component_path: ""
            release_tag: 1.0.0
          - id: window-manager
            repository: leanflutter/window_manager
            commit: 4080b59c0b1084c6085f1613c660382cd164ad76
            source_version: 0.5.2
            component_path: packages/window_manager
            release_tag: ""
          - id: flutter-window-close
            repository: zonble/flutter_window_close
            commit: 56ff690f0f9781c4795fae7ba3fae626c6ec80a1
            source_version: 1.3.0
            component_path: ""
            release_tag: 1.3.0
          - id: shutdown
            repository: isoos/shutdown
            commit: 9c4a1c590db3315fc8ddeef59e8cb2e9aaed68bd
            source_version: 0.4.4
            component_path: ""
            release_tag: ""
          - id: graceful
            repository: doodlezucc/dart_graceful
            commit: a96a888f5ec2635c6e52068529d5cc72a3b7eaa9
            source_version: 1.2.0
            component_path: ""
            release_tag: ""
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight ${{ matrix.id }}
        env:
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-${{ matrix.id }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          COMPONENT_PATH: ${{ matrix.component_path }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          args=(
            preflight-pinned
            --repository "$UPSTREAM_REPOSITORY"
            --commit "$UPSTREAM_COMMIT"
            --source-version "$SOURCE_VERSION"
          )
          if [[ -n "$COMPONENT_PATH" ]]; then
            args+=(--component-path "$COMPONENT_PATH")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          researcher "${args[@]}" | tee "${{ matrix.id }}-preflight.json"
      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-lifecycle-${{ matrix.id }}-evidence
          if-no-files-found: error
          retention-days: 7
          path: ${{ matrix.id }}-preflight.json
