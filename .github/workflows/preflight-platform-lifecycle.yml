name: Preflight platform.lifecycle candidates

on:
  push:
    branches:
      - proof-platform-lifecycle-v1

permissions:
  contents: read

jobs:
  app-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight app_lifecycle_protector 0.0.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-app-lifecycle-protector
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository huanguan1978/app_lifecycle_protector \
            --commit 9a2ae9eafb88cfdb29a531fb824a3338eb1f74df \
            --source-version 0.0.3 \
            | tee app-lifecycle-protector-preflight.json
      - name: Preflight lifecycle 1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-lifecycle
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository chenenyu/lifecycle \
            --commit 3c1f0b3b7e95f53017bc60e14f8fbba65f06bcf9 \
            --release-tag 1.0.0 \
            --source-version 1.0.0 \
            | tee lifecycle-preflight.json
      - name: Upload app lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-lifecycle-app-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            app-lifecycle-protector-preflight.json
            lifecycle-preflight.json

  desktop-close:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight window_manager 0.5.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-window-manager
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository leanflutter/window_manager \
            --commit 4080b59c0b1084c6085f1613c660382cd164ad76 \
            --component-path packages/window_manager \
            --source-version 0.5.2 \
            | tee window-manager-preflight.json
      - name: Preflight flutter_window_close 1.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-flutter-window-close
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository zonble/flutter_window_close \
            --commit 56ff690f0f9781c4795fae7ba3fae626c6ec80a1 \
            --release-tag 1.3.0 \
            --source-version 1.3.0 \
            | tee flutter-window-close-preflight.json
      - name: Upload desktop lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-lifecycle-desktop-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            window-manager-preflight.json
            flutter-window-close-preflight.json

  pi-shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight shutdown 0.4.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-shutdown
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository isoos/shutdown \
            --commit 9c4a1c590db3315fc8ddeef59e8cb2e9aaed68bd \
            --source-version 0.4.4 \
            | tee shutdown-preflight.json
      - name: Preflight graceful 1.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-graceful
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository doodlezucc/dart_graceful \
            --commit a96a888f5ec2635c6e52068529d5cc72a3b7eaa9 \
            --source-version 1.2.0 \
            | tee graceful-preflight.json
      - name: Upload Raspberry Pi lifecycle evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-lifecycle-pi-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            shutdown-preflight.json
            graceful-preflight.json
