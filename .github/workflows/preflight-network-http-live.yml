name: Preflight network.http live candidates

on:
  push:
    branches:
      - proof-network-http-live-security

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight package http
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-http
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository dart-lang/http \
            --commit 907782f5a792e7a5b0ed92f118c0ad91f3ecde51 \
            --source-version 1.6.0 \
            --component-path pkgs/http

      - name: Preflight Dio
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-dio
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository cfug/dio \
            --commit 4684e29dabaa2655606f1620a4ed316ee3f8c963 \
            --release-tag dio_v5.11.1 \
            --source-version 5.11.1 \
            --component-path dio
