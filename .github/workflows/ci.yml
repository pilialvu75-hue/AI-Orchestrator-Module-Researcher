name: CI

on:
  push:
    branches: ["main", "researcher-v1-milestone1"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check ruff mypy bandit
      - name: Syntax
        run: python -m compileall -q src tests
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/researcher
      - name: Security static checks
        run: |
          bandit -q -r src/researcher
          python tools/guardrails.py
      - name: Unit and integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
