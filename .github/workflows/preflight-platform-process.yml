name: Preflight platform.process candidates

on:
  push:
    branches:
      - proof-platform-process-live-security

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight package:process
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-process
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository dart-lang/tools \
            --commit c7f7a63f656f268f8a88dde5bbceeb9367b90aaa \
            --release-tag process-v5.0.6 \
            --source-version 5.0.6 \
            --component-path pkgs/process

      - name: Preflight process_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-process-run
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository tekartik/process_run.dart \
            --commit 45a0244d202d06d39793fe986f06f514516cc41d \
            --source-version 1.3.6 \
            --component-path packages/process_run
