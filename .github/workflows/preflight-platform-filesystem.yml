name: Preflight platform.filesystem candidates

on:
  push:
    branches:
      - proof-platform-filesystem-live-security

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight package:file
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-file
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository dart-lang/tools \
            --commit 3f7a46606496f826c2f60586ab71c2b7a9bfbf15 \
            --release-tag file-v7.0.1 \
            --source-version 7.0.1 \
            --component-path pkgs/file

      - name: Preflight cellar_flutter
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-cellar-flutter
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository whuppi/cellar_flutter \
            --commit ecf8d628c3942d73aee8c14e47b6560515e68827 \
            --release-tag v1.0.0 \
            --source-version 1.0.0
