name: Preflight diagnostics.logging Talker

on:
  push:
    branches:
      - preflight-diagnostics-talker

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository Frezyx/talker \
            --commit 654391c1a81c6a0fa4a05d46562cc0d15241d964 \
            --source-version 5.1.20 \
            --component-path packages/talker
