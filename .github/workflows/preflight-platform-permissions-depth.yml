name: Preflight platform.permissions depth candidates

on:
  push:
    branches:
      - proof-platform-permissions-depth-v1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight permission_plus
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-permission-plus
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository jagadeeshchoudhary/permission_plus \
            --commit 67b6993f01be6ebe47d2310fc5e491e175eb4a1c \
            --source-version 1.0.0 \
            | tee permission-plus-preflight.json

      - name: Preflight permission_plus_linux backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-permission-plus-linux
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository jagadeeshchoudhary/permission_plus_linux \
            --commit 3a2e42674678324fdd0a333111866c7f11923711 \
            --source-version 1.0.0 \
            | tee permission-plus-linux-preflight.json

      - name: Preflight permission_plus_apple backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-permission-plus-apple
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository jagadeeshchoudhary/permission_plus_apple \
            --commit 710daa6e3a26546a13bd0f2de085bcc771ce9145 \
            --source-version 1.0.0 \
            | tee permission-plus-apple-preflight.json

      - name: Preflight permission_manager
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-permission-manager
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository manojprajapati1999/permission_manager \
            --commit daa1872c4e8115f3f616395ac5558a1ac706c364 \
            --source-version 2.0.9 \
            | tee permission-manager-preflight.json

      - name: Upload immutable preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-permissions-depth-preflight-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            permission-plus-preflight.json
            permission-plus-linux-preflight.json
            permission-plus-apple-preflight.json
            permission-manager-preflight.json
