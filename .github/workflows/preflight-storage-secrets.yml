name: Preflight storage.secrets flutter_secure_storage

on:
  push:
    branches:
      - preflight-storage-secrets

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository juliansteenbakker/flutter_secure_storage \
            --commit 7ee0d6733b3e5179f6874eff34f6d9756c44c16e \
            --release-tag flutter_secure_storage-v11.1.1 \
            --source-version 11.1.1 \
            --component-path flutter_secure_storage
