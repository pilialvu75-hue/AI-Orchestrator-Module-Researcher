name: Preflight ai.acceleration_backend candidates

on:
  push:
    branches:
      - proof-ai-acceleration-backend-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: llama-cpp-backends
            repository: ggml-org/llama.cpp
            commit: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
            source_version: 0.4.1
            component_path: ggml/src
            release_tag: v0.4.1
          - id: onnxruntime-providers
            repository: microsoft/onnxruntime
            commit: f2c39fe2f838cf35ce7da92824f5a5e3ee6e88a7
            source_version: 1.30.0
            component_path: onnxruntime/core/providers
            release_tag: v1.30.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight ${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          ALLOW_LIBRARY_WRITE: 'false'
          DIAGNOSTICS_ENABLED: 'false'
          DATA_DIR: ${{ runner.temp }}/researcher-${{ matrix.id }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          COMPONENT_PATH: ${{ matrix.component_path }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          CANDIDATE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository "$UPSTREAM_REPOSITORY" \
            --commit "$UPSTREAM_COMMIT" \
            --source-version "$SOURCE_VERSION" \
            --component-path "$COMPONENT_PATH" \
            --release-tag "$RELEASE_TAG" \
            | tee "${CANDIDATE_ID}-preflight.json"
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-acceleration-${{ matrix.id }}-evidence
          path: ${{ matrix.id }}-preflight.json
          if-no-files-found: ignore
          retention-days: 7
