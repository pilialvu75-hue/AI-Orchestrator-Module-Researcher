name: Preflight diagnostics.logging SourceHorizon logger

on:
  push:
    branches:
      - preflight-diagnostics-sourcehorizon

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository SourceHorizon/logger \
            --commit c4d65c3ecb2dbf275d32fc4ef0f2a7af3d45d0b7 \
            --release-tag v2.8.0 \
            --source-version 2.8.0
