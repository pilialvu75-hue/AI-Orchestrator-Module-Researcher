name: Preflight platform.connectivity candidates

on:
  push:
    branches:
      - proof-platform-connectivity-v1

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: connectivity-plus
            repository: fluttercommunity/plus_plugins
            commit: 13e170479b3c66c890fa401f5fdb3af141faf67a
            source_version: 7.3.1
            component_path: packages/connectivity_plus/connectivity_plus
            release_tag: connectivity_plus-v7.3.1
          - id: internet-connection-checker-plus
            repository: OutdatedGuy/internet_connection_checker_plus
            commit: b7e38f42cc1b30ebad0dd927fe771c0b3b34142b
            source_version: 3.1.2
            component_path: ""
            release_tag: v3.1.2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight ${{ matrix.id }}
        env:
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-${{ matrix.id }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          COMPONENT_PATH: ${{ matrix.component_path }}
          RELEASE_TAG: ${{ matrix.release_tag }}
        run: |
          set -euo pipefail
          args=(
            preflight-pinned
            --repository "$UPSTREAM_REPOSITORY"
            --commit "$UPSTREAM_COMMIT"
            --source-version "$SOURCE_VERSION"
          )
          if [[ -n "$COMPONENT_PATH" ]]; then
            args+=(--component-path "$COMPONENT_PATH")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          researcher "${args[@]}" | tee "${{ matrix.id }}-preflight.json"
      - name: Upload immutable evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-connectivity-${{ matrix.id }}-evidence
          if-no-files-found: error
          retention-days: 7
          path: ${{ matrix.id }}-preflight.json
