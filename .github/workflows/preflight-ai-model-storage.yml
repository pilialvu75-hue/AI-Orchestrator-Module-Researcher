name: Preflight ai.model_storage candidates

on:
  push:
    branches:
      - proof-ai-model-storage-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: huggingface-hub-dart
            repository: NathanKolbas/huggingface_hub_dart
            commit: 9cc45ef5681858af0777b6ba8c8295d30f6dcfae
            source_version: 0.0.3
            release_tag: v0.0.3
          - id: cellar
            repository: whuppi/cellar
            commit: 430784710654f9ea329067e1978e82e7b6f91fec
            source_version: 1.0.0
            release_tag: v1.0.0
          - id: resumable-downloader
            repository: landxcape/resumable_downloader
            commit: aec93d1c32846a0b361e1eb74ff98ed0db478fe1
            source_version: 0.1.2
            release_tag: 0.1.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight ${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          ALLOW_LIBRARY_WRITE: 'false'
          DIAGNOSTICS_ENABLED: 'false'
          DATA_DIR: ${{ runner.temp }}/researcher-${{ matrix.id }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          CANDIDATE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository "$UPSTREAM_REPOSITORY" \
            --commit "$UPSTREAM_COMMIT" \
            --source-version "$SOURCE_VERSION" \
            --release-tag "$RELEASE_TAG" \
            | tee "${CANDIDATE_ID}-preflight.json"
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-model-storage-${{ matrix.id }}-evidence
          path: ${{ matrix.id }}-preflight.json
          if-no-files-found: ignore
          retention-days: 7
