name: Preflight storage.secrets live candidates

on:
  push:
    branches:
      - proof-storage-secrets-live-security

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight flutter_secure_storage
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-fss
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository juliansteenbakker/flutter_secure_storage \
            --commit 7ee0d6733b3e5179f6874eff34f6d9756c44c16e \
            --release-tag flutter_secure_storage-v11.1.1 \
            --source-version 11.1.1 \
            --component-path flutter_secure_storage

      - name: Preflight webauthn_secure_storage
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-webauthn
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository JohnGalt1717/webauthn_secure_storage \
            --commit 807eb716e506bcc48e7b5a739d2b2c93131cf6d0 \
            --source-version 0.2.3 \
            --component-path webauthn_secure_storage
