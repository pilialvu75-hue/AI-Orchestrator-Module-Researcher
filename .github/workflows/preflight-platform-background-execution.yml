name: Preflight platform.background_execution

on:
  push:
    branches:
      - proof-platform-background-execution-v1

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight flutter_workmanager v0.10.10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-workmanager
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository fluttercommunity/flutter_workmanager \
            --commit 896c4c1122f5e267ed472b044219c884305246d3 \
            --component-path workmanager \
            --release-tag v0.10.10 \
            --source-version 0.10.10 \
            | tee flutter-workmanager-preflight.json

      - name: Preflight native_workmanager v1.8.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-native-workmanager
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository brewkits/native_workmanager \
            --commit 180bea8e7a7786f29bc8fee38877772c10bb2228 \
            --release-tag v1.8.1 \
            --source-version 1.8.1 \
            | tee native-workmanager-preflight.json

      - name: Preflight auto_start_flutter 1.4.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-auto-start
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository seena98/auto_start_flutter \
            --commit 25cdc7c5678f5d17045a4a7e30496f1582339dcd \
            --source-version 1.4.0 \
            | tee auto-start-flutter-preflight.json

      - name: Preflight dart_service_manager v1.3.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-service-manager
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository OmnyGrid/dart_service_manager \
            --commit 0ec66a53b5a328c1990ffecce801e1009be77650 \
            --release-tag v1.3.1 \
            --source-version 1.3.1 \
            | tee dart-service-manager-preflight.json

      - name: Upload immutable preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-background-execution-preflight-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            flutter-workmanager-preflight.json
            native-workmanager-preflight.json
            auto-start-flutter-preflight.json
            dart-service-manager-preflight.json
