name: Module Evolution Worker

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: researcher-state-v2
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Restore durable Researcher state
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/researcher-data
          key: researcher-state-v2-${{ github.run_id }}
          restore-keys: |
            researcher-state-v2-
          enableCrossOsArchive: false

      - name: Recover legacy direct-Cantiere claims
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          researcher recover-evolution-queue --limit 8 | tee "${RUNNER_TEMP}/evolution-recovery.json"

      - name: Snapshot pending Library-gated evolution work
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          researcher handoffs > "${RUNNER_TEMP}/evolution-handoffs.json"
          python - <<'PY'
          import json
          import os

          source = os.path.join(os.environ["RUNNER_TEMP"], "evolution-handoffs.json")
          target = os.path.join(os.environ["RUNNER_TEMP"], "evolution-work.json")
          with open(source, encoding="utf-8") as handle:
              handoffs = json.load(handle)
          payload = {
              "state": "READY" if handoffs else "IDLE",
              "pending_count": len(handoffs),
              "proposals": handoffs[:8],
              "routing_boundary": "library_only",
              "direct_cantiere_dispatch": False,
              "source_code_transferred": False,
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Prepare isolated builder work orders
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads((root / "evolution-work.json").read_text(encoding="utf-8"))
          orders = []
          for proposal in payload["proposals"]:
              proposal_id = proposal.get("proposal_id")
              capability_id = proposal.get("capability_id")
              if not isinstance(proposal_id, str) or not isinstance(capability_id, str):
                  continue
              result = subprocess.run(
                  [
                      "researcher", "builder-request",
                      "--proposal-id", proposal_id,
                      "--capability-id", capability_id,
                  ],
                  check=True, capture_output=True, text=True,
              )
              order = json.loads(result.stdout)
              if order["library_publish_allowed"] is not False:
                  raise SystemExit("Builder order unexpectedly permits publication")
              orders.append(order)
          (root / "evolution-builder-orders.json").write_text(
              json.dumps({"orders": orders, "execution_started": False}, indent=2),
              encoding="utf-8",
          )
          print(f"Prepared {len(orders)} isolated builder orders; no execution.")
          PY

      - name: Enforce Researcher-Library-Cantiere isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/evolution-worker.yml").read_text(encoding="utf-8")
          forbidden = (
              "RESEARCHER_" + "CANTIERE_TOKEN",
              "Ai-orchestrator-" + "riserva",
              "researcher_" + "evolution_work",
              "/" + "dispatches",
          )
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(
                  "Direct Researcher-to-Cantiere routing is forbidden: " + ", ".join(found)
              )
          print("Researcher evolution boundary: Library only.")
          PY

      - name: Preserve sanitized evolution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: module-evolution-work-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evolution-recovery.json
            ${{ runner.temp }}/evolution-work.json
            ${{ runner.temp }}/evolution-builder-orders.json
          if-no-files-found: error
          retention-days: 14
