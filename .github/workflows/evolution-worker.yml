name: Module Evolution Worker

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: researcher-state-v2
  cancel-in-progress: false

jobs:
  evolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Restore durable Researcher state
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/researcher-data
          key: researcher-state-v2-${{ github.run_id }}
          restore-keys: |
            researcher-state-v2-
          enableCrossOsArchive: false

      - name: Recover legacy direct-Cantiere claims
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          researcher recover-evolution-queue --limit 8 | tee "${RUNNER_TEMP}/evolution-recovery.json"

      - name: Snapshot pending Library-gated evolution work
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          researcher handoffs > "${RUNNER_TEMP}/evolution-handoffs.json"
          python - <<'PY'
          import json
          import os

          source = os.path.join(os.environ["RUNNER_TEMP"], "evolution-handoffs.json")
          target = os.path.join(os.environ["RUNNER_TEMP"], "evolution-work.json")
          with open(source, encoding="utf-8") as handle:
              handoffs = json.load(handle)
          payload = {
              "state": "READY" if handoffs else "IDLE",
              "pending_count": len(handoffs),
              "proposals": handoffs[:8],
              "routing_boundary": "library_only",
              "direct_cantiere_dispatch": False,
              "source_code_transferred": False,
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Prepare isolated builder work orders
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          payload = json.loads((root / "evolution-work.json").read_text(encoding="utf-8"))
          orders = []
          for proposal in payload["proposals"]:
              proposal_id = proposal.get("proposal_id")
              capability_id = proposal.get("capability_id")
              if not isinstance(proposal_id, str) or not isinstance(capability_id, str):
                  continue
              delta = proposal.get("knowledge_delta", [])
              if not isinstance(delta, list) or not all(isinstance(x, str) for x in delta):
                  raise SystemExit("Invalid research knowledge delta")
              command = [
                  "researcher", "builder-request",
                  "--proposal-id", proposal_id,
                  "--capability-id", capability_id,
              ]
              for observation in delta:
                  command.extend(["--knowledge-delta", observation])
              result = subprocess.run(
                  command, check=True, capture_output=True, text=True,
              )
              order = json.loads(result.stdout)
              if order["library_publish_allowed"] is not False:
                  raise SystemExit("Builder order unexpectedly permits publication")
              if order["knowledge_delta"] != delta:
                  raise SystemExit("Builder order lost research knowledge")
              if set(order["acceptance_gates"]) != set(proposal["acceptance_gates"]):
                  raise SystemExit("Builder acceptance gates diverge from proposal")
              orders.append(order)
          (root / "evolution-builder-orders.json").write_text(
              json.dumps({"orders": orders, "execution_started": False}, indent=2),
              encoding="utf-8",
          )
          print(f"Prepared {len(orders)} isolated builder orders; no execution.")
          PY

      - name: Execute first supported isolated builder order
        env:
          DATA_DIR: ${{ runner.temp }}/researcher-data
          RESEARCHER_MODE: IMPROVEMENT
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          from researcher.first_party_builder import FirstPartyPilotBuilder, IMAGE

          root = Path(os.environ["RUNNER_TEMP"])
          orders = json.loads((root / "evolution-builder-orders.json").read_text())
          supported = [
              order for order in orders["orders"]
              if order.get("capability_id") == "diagnostics.logging"
          ]
          if not supported:
              result = {"state": "NO_SUPPORTED_ORDER", "execution_started": False}
          else:
              # Fetch the exact trusted image before executing the networkless sandbox.
              subprocess.run(["docker", "pull", IMAGE], check=True, timeout=180)
              result = FirstPartyPilotBuilder().build(
                  supported[0],
                  source_commit=os.environ["GITHUB_SHA"],
                  output_dir=root / "evolution-candidates",
              )
              evidence = result["evidence"]
              required = (
                  "implementation_tests_pass",
                  "security_gates_pass",
                  "regression_tests_pass",
              )
              if not all(evidence[gate] for gate in required):
                  raise SystemExit("Isolated candidate verification failed")
              if result["accepted"] or evidence["library_contract_pass"]:
                  raise SystemExit("Researcher must not certify Library integration")
          (root / "evolution-builder-result.json").write_text(
              json.dumps(result, indent=2, sort_keys=True), encoding="utf-8"
          )
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Enforce Researcher-Library-Cantiere isolation
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/evolution-worker.yml").read_text(encoding="utf-8")
          forbidden = (
              "RESEARCHER_" + "CANTIERE_TOKEN",
              "Ai-orchestrator-" + "riserva",
              "researcher_" + "evolution_work",
              "/" + "dispatches",
          )
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(
                  "Direct Researcher-to-Cantiere routing is forbidden: " + ", ".join(found)
              )
          print("Researcher evolution boundary: Library only.")
          PY

      - name: Preserve sanitized evolution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: module-evolution-work-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/evolution-recovery.json
            ${{ runner.temp }}/evolution-work.json
            ${{ runner.temp }}/evolution-builder-orders.json
            ${{ runner.temp }}/evolution-builder-result.json
            ${{ runner.temp }}/evolution-candidates/*.zip
          if-no-files-found: error
          retention-days: 14
