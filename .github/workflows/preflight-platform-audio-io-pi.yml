name: Preflight platform.audio_io Raspberry Pi candidates

on:
  push:
    branches:
      - proof-platform-audio-io-pi-depth

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: miniaudio
            repository: mackron/miniaudio
            commit: 9634bedb5b5a2ca38c1ee7108a9358a4e233f14d
            release_tag: 0.11.25
            source_version: 0.11.25
          - label: portaudio
            repository: PortAudio/portaudio
            commit: 147dd722548358763a8b649b3e4b41dfffbcfbb6
            release_tag: v19.7.0
            source_version: 19.7.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight-${{ matrix.label }}
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository "${{ matrix.repository }}" \
            --commit "${{ matrix.commit }}" \
            --release-tag "${{ matrix.release_tag }}" \
            --source-version "${{ matrix.source_version }}"
