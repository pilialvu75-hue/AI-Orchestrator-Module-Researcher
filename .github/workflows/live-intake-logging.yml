name: One-time Gate Check - diagnostics.logging

on:
  push:
    branches:
      - ops-live-intake-logging-run
    paths:
      - .github/workflows/live-intake-logging.yml

permissions:
  contents: read

concurrency:
  group: one-time-gate-diagnostics-logging
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable component security and OSV gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DATA_DIR: ${{ runner.temp }}/researcher-data
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from researcher.component_candidate import ComponentCandidateResolver
          from researcher.component_security import ComponentAwareGitHubSecurityScanner
          from researcher.github_api import GitHubApi
          from researcher.rate_limit import RateLimitManager
          from researcher.state import SQLiteStateStore
          from researcher.vulnerability import OsvClient, OsvVulnerabilityScanner
          from researcher.vulnerability_admission import GitHubVulnerabilityAdmissionScanner

          state = SQLiteStateStore(Path(os.environ["DATA_DIR"]) / "gate.db")
          api = GitHubApi(os.environ.get("GITHUB_TOKEN"))
          rate_limits = RateLimitManager(state)
          resolver = ComponentCandidateResolver(api, rate_limits)
          candidate = resolver.resolve(
              "dart-lang/core",
              "8151b9f57fa3fee10421a19ce24470e143c0dee5",
              release_tag="logging-v1.3.0",
              source_version="1.3.0",
              component_path="pkgs/logging",
          )
          security = ComponentAwareGitHubSecurityScanner(api, rate_limits).scan(candidate)
          vulnerability = GitHubVulnerabilityAdmissionScanner(
              api,
              rate_limits,
              OsvVulnerabilityScanner(OsvClient()),
          ).scan(candidate, security)
          result = {
              "candidate": {
                  "repository": candidate.repository,
                  "commit_sha": candidate.commit_sha,
                  "component_path": candidate.extra.get("component_path"),
                  "source_version": candidate.extra.get("source_version"),
              },
              "security": security.to_dict(),
              "vulnerability": vulnerability.to_dict(),
              "admission_eligible": (
                  security.admission_eligible and vulnerability.admission_eligible
              ),
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          if not result["admission_eligible"]:
              raise SystemExit("candidate did not pass all admission gates")
          PY
