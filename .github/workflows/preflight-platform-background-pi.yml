name: Preflight platform.background_execution Raspberry Pi providers

on:
  push:
    branches:
      - proof-platform-background-execution-v1

permissions:
  contents: read

jobs:
  pi-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Preflight Supervisor 4.3.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-supervisor
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository Supervisor/supervisor \
            --commit dbca8d457e61d8707c40f99c78330b87939483a3 \
            --release-tag 4.3.0 \
            --source-version 4.3.0 \
            | tee supervisor-preflight.json

      - name: Preflight RunWisp pinned snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-runwisp
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository runwisp/runwisp \
            --commit 112f226e63273fd5c0e90959cda42aba80299c37 \
            --source-version snapshot-2026-09-14 \
            | tee runwisp-preflight.json

      - name: Upload immutable Raspberry Pi preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: platform-background-execution-pi-preflight-evidence
          if-no-files-found: error
          retention-days: 7
          path: |
            supervisor-preflight.json
            runwisp-preflight.json
