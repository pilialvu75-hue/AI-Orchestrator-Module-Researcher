name: Preflight platform.power_thermal candidates

on:
  push:
    branches:
      - proof-platform-power-thermal-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    name: candidate (${{ matrix.id }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: battery-plus
            repository: fluttercommunity/plus_plugins
            commit: 93361872f025cc1b12a9477f628c541b483bf81f
            source_version: 7.1.1
            component_path: packages/battery_plus/battery_plus
            release_tag: battery_plus-v7.1.1
          - id: thermal
            repository: muxable/flutter_thermal
            commit: fc1e2c43ba25175f449a2d008fe52e5889006e38
            source_version: 1.2.2
            component_path: ''
            release_tag: v1.2.2
          - id: libre-hardware-monitor
            repository: LibreHardwareMonitor/LibreHardwareMonitor
            commit: 3d331e3370efb858411f19511373eff65a218701
            source_version: 0.9.6
            component_path: ''
            release_tag: v0.9.6
          - id: lm-sensors
            repository: lm-sensors/lm-sensors
            commit: 1667b850a1ce38151dae17156276f981be6fb557
            source_version: 3.6.0
            component_path: ''
            release_tag: V3-6-0
          - id: stats-macos
            repository: exelban/stats
            commit: b4251e2ba05511de6b51b296d7b9e98a9c6545f5
            source_version: 3.0.16
            component_path: ''
            release_tag: v3.0.16
          - id: raspberrypi-utils
            repository: raspberrypi/utils
            commit: ebc4a56bac3a896d5c14e56fe27dcd6cb36dd373
            source_version: 2026-09-14
            component_path: vcgencmd
            release_tag: ''
          - id: js-bindings-web
            repository: jodinathan/js_bindings
            commit: d89c98428e8f9a5b3532263263cf32599521e949
            source_version: 0.1.2+2
            component_path: ''
            release_tag: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Preflight ${{ matrix.id }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: 'true'
          ALLOW_LIBRARY_WRITE: 'false'
          DIAGNOSTICS_ENABLED: 'false'
          DATA_DIR: ${{ runner.temp }}/researcher-${{ matrix.id }}
          UPSTREAM_REPOSITORY: ${{ matrix.repository }}
          UPSTREAM_COMMIT: ${{ matrix.commit }}
          SOURCE_VERSION: ${{ matrix.source_version }}
          COMPONENT_PATH: ${{ matrix.component_path }}
          RELEASE_TAG: ${{ matrix.release_tag }}
          CANDIDATE_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          args=(
            preflight-pinned
            --repository "$UPSTREAM_REPOSITORY"
            --commit "$UPSTREAM_COMMIT"
            --source-version "$SOURCE_VERSION"
          )
          if [[ -n "$COMPONENT_PATH" ]]; then
            args+=(--component-path "$COMPONENT_PATH")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          researcher "${args[@]}" | tee "${CANDIDATE_ID}-preflight.json"
      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-power-thermal-${{ matrix.id }}-evidence
          path: ${{ matrix.id }}-preflight.json
          if-no-files-found: ignore
          retention-days: 7
