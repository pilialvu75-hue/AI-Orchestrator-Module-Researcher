name: Preflight release.update_manager app_updater

on:
  push:
    branches:
      - preflight-release-app-updater

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run immutable source preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: "true"
          ALLOW_LIBRARY_WRITE: "false"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-preflight
        run: |
          set -euo pipefail
          researcher preflight-pinned \
            --repository mantreshkhurana/app_updater \
            --commit e7c140749339fb1838bb83ca9c8e2a5c6a73bd1e \
            --release-tag 2.1.0 \
            --source-version 2.1.0
