name: Autonomous Library Seeding

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  # Both workflows mutate the same cached SQLite state. Serialize them so a
  # seeding run cannot fork state while the evolution worker is claiming work.
  group: researcher-state-v2
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify dedicated Library credential
        env:
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
        run: |
          if [[ -z "${LIBRARY_GITHUB_TOKEN}" ]]; then
            echo "::error title=Missing Library credential::Configure RESEARCHER_LIBRARY_TOKEN in repository Actions secrets."
            exit 1
          fi
      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .
      - name: Restore durable Researcher state
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/researcher-data
          key: researcher-state-v2-${{ github.run_id }}
          restore-keys: |
            researcher-state-v2-
          enableCrossOsArchive: false
      - name: Run bounded multi-need seeding sweep
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIRST_PARTY_SOURCE_GITHUB_TOKEN: ${{ secrets.RESEARCHER_FIRST_PARTY_SOURCE_TOKEN }}
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
          LIBRARY_REPOSITORY: pilialvu75-hue/AI-Orchestrator-Module-Library
          LIBRARY_REF: main
          RESEARCHER_MODE: SEEDING
          DRY_RUN: "false"
          ALLOW_LIBRARY_WRITE: "true"
          DIAGNOSTICS_ENABLED: "true"
          DIAGNOSTICS_GITHUB_TOKEN: ${{ secrets.RESEARCHER_DIAGNOSTICS_TOKEN }}
          DIAGNOSTICS_REPOSITORY: pilialvu75-hue/Ai-orchestrator-diagnostics
          DIAGNOSTICS_INSTANCE_ID: github-actions-autonomous-seeding
          RESEARCHER_COMMIT: ${{ github.sha }}
          DATA_DIR: ${{ runner.temp }}/researcher-data
        run: |
          set -Eeuo pipefail
          trap 'echo "::error title=Researcher seeding failed::Command failed at line $LINENO (exit $?). Check the named command and diagnostics artifact."' ERR
          echo "::group::Backfill researcher knowledge"
          researcher backfill-knowledge --limit 250 | tee "${RUNNER_TEMP}/researcher-backfill-result.json"
          echo "::endgroup::"
          echo "::group::Run researcher sweep"
          researcher sweep --cycles 4 | tee "${RUNNER_TEMP}/researcher-cycle-result.json"
          echo "::endgroup::"
          echo "::group::Collect researcher diagnostics"
          researcher events --limit 1000 > "${RUNNER_TEMP}/researcher-events.json"
          researcher handoffs > "${RUNNER_TEMP}/researcher-handoffs.json"
          echo "::endgroup::"
          echo "::group::Validate seeding health"
          python tools/seeding_health_report.py --backfill "${RUNNER_TEMP}/researcher-backfill-result.json" --sweep "${RUNNER_TEMP}/researcher-cycle-result.json" --output "${RUNNER_TEMP}/researcher-run-health.json"
          echo "::endgroup::"
          # Make zero-yield production runs visible in Actions logs as well as artifacts.
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "researcher-run-health.json"
          health = json.loads(report.read_text(encoding="utf-8"))
          if health["outcome"] == "ZERO_DISCOVERY":
              print("::warning title=Researcher zero discovery::Seeding completed without discovering any candidates; inspect run-health.json and discovery diagnostics.")
          elif health["outcome"] == "BLOCKED":
              print("::warning title=Researcher seeding blocked::Discovery or delivery was blocked; inspect run-health.json.")
          PY
          # Summarize actionable evolution work without claiming it. Claims are
          # owned exclusively by Module Evolution Worker so seeding cannot strand
          # PROPOSED work in QUEUED.
          python - <<'PY'
          import json
          import os

          source = os.path.join(os.environ["RUNNER_TEMP"], "researcher-handoffs.json")
          target = os.path.join(os.environ["RUNNER_TEMP"], "researcher-evolution-preview.json")
          with open(source, encoding="utf-8") as handle:
              handoffs = json.load(handle)
          preview = {
              "state": "READY" if handoffs else "IDLE",
              "pending_count": len(handoffs),
              "proposal_ids": [item["proposal_id"] for item in handoffs[:8]],
              "capability_ids": sorted({item["capability_id"] for item in handoffs}),
              "mutated_state": False,
          }
          with open(target, "w", encoding="utf-8") as handle:
              json.dump(preview, handle, indent=2, sort_keys=True)
          PY
      - name: Preserve sanitized seeding diagnostics
        if: ${{ always() }}
        run: |
          evidence="${RUNNER_TEMP}/seeding-diagnostics"
          mkdir -p "$evidence"
          if [[ -s "${RUNNER_TEMP}/researcher-backfill-result.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-backfill-result.json" "$evidence/backfill-result.json"
          fi
          if [[ -s "${RUNNER_TEMP}/researcher-cycle-result.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-cycle-result.json" "$evidence/cycle-result.json"
          fi
          if [[ -s "${RUNNER_TEMP}/researcher-events.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-events.json" "$evidence/events.json"
          fi
          if [[ -s "${RUNNER_TEMP}/researcher-handoffs.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-handoffs.json" "$evidence/handoffs.json"
          fi
          if [[ -s "${RUNNER_TEMP}/researcher-run-health.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-run-health.json" "$evidence/run-health.json"
          fi
          if [[ -s "${RUNNER_TEMP}/researcher-evolution-preview.json" ]]; then
            cp "${RUNNER_TEMP}/researcher-evolution-preview.json" "$evidence/evolution-preview.json"
          fi
          cat > "$evidence/run.json" <<EOF
          {"schema":"ai-orchestrator.researcher-seeding-run.v1","run_id":"${GITHUB_RUN_ID}","run_attempt":"${GITHUB_RUN_ATTEMPT}","researcher_commit":"${GITHUB_SHA}","library_repository":"pilialvu75-hue/AI-Orchestrator-Module-Library","mode":"SEEDING"}
          EOF
      - name: Upload seeding diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-seeding-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/seeding-diagnostics
          if-no-files-found: error
          retention-days: 14
