name: Pinned Library Intake

on:
  workflow_dispatch:
    inputs:
      capability:
        description: "Library capability id (for example network.http)"
        required: true
        type: string
      repository:
        description: "Pinned upstream GitHub repository in owner/name form"
        required: true
        type: string
      commit:
        description: "Exact 40-character upstream commit SHA"
        required: true
        type: string
      release_tag:
        description: "Optional upstream release tag; must resolve to the exact commit"
        required: false
        type: string
      source_version:
        description: "Optional human-readable stable upstream version"
        required: false
        type: string
      rescan:
        description: "Re-run admission gates for an already known candidate"
        required: true
        default: false
        type: boolean
      confirm_write:
        description: "Required acknowledgement that an eligible candidate may open a Library intake PR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pinned-intake-${{ inputs.capability }}-${{ inputs.repository }}-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  intake:
    if: ${{ inputs.confirm_write }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dedicated Library credential
        env:
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
        run: |
          if [[ -z "${LIBRARY_GITHUB_TOKEN}" ]]; then
            echo "Missing RESEARCHER_LIBRARY_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run pinned admission and intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
          LIBRARY_REPOSITORY: pilialvu75-hue/AI-Orchestrator-Module-Library
          LIBRARY_REF: main
          DRY_RUN: "false"
          ALLOW_LIBRARY_WRITE: "true"
          DIAGNOSTICS_ENABLED: "false"
          DATA_DIR: ${{ runner.temp }}/researcher-data
          CAPABILITY: ${{ inputs.capability }}
          UPSTREAM_REPOSITORY: ${{ inputs.repository }}
          UPSTREAM_COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          RESCAN: ${{ inputs.rescan }}
        run: |
          set -euo pipefail
          args=(
            admit-pinned
            --capability "$CAPABILITY"
            --repository "$UPSTREAM_REPOSITORY"
            --commit "$UPSTREAM_COMMIT"
          )
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          if [[ -n "$SOURCE_VERSION" ]]; then
            args+=(--source-version "$SOURCE_VERSION")
          fi
          if [[ "$RESCAN" == "true" ]]; then
            args+=(--rescan)
          fi
          researcher "${args[@]}"
