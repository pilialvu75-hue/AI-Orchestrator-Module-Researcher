name: Pinned Library Intake

on:
  workflow_dispatch:
    inputs:
      capability:
        description: "Library capability id (for example network.http)"
        required: true
        type: string
      repository:
        description: "Pinned upstream GitHub repository in owner/name form"
        required: true
        type: string
      commit:
        description: "Exact 40-character upstream commit SHA"
        required: true
        type: string
      component_path:
        description: "Optional safe monorepo component subdirectory (for example pkgs/logging)"
        required: false
        type: string
      release_tag:
        description: "Optional upstream release tag; must resolve to the exact commit"
        required: false
        type: string
      source_version:
        description: "Optional human-readable stable upstream version"
        required: false
        type: string
      rescan:
        description: "Re-run admission gates for an already known candidate"
        required: true
        default: false
        type: boolean
      confirm_write:
        description: "Required acknowledgement that an eligible candidate may open a Library intake PR"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pinned-intake-${{ inputs.capability }}-${{ inputs.repository }}-${{ inputs.commit }}
  cancel-in-progress: false

jobs:
  intake:
    if: ${{ inputs.confirm_write }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify dedicated Library credential
        env:
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
        run: |
          if [[ -z "${LIBRARY_GITHUB_TOKEN}" ]]; then
            echo "Missing RESEARCHER_LIBRARY_TOKEN repository secret." >&2
            exit 1
          fi

      - name: Report diagnostics credential state
        env:
          DIAGNOSTICS_GITHUB_TOKEN: ${{ secrets.RESEARCHER_DIAGNOSTICS_TOKEN }}
        run: |
          if [[ -z "${DIAGNOSTICS_GITHUB_TOKEN}" ]]; then
            echo "::warning::RESEARCHER_DIAGNOSTICS_TOKEN is not configured; the Researcher will record MISCONFIGURED locally and the workflow artifact remains the fallback evidence."
          else
            echo "Dedicated Researcher diagnostics credential is configured."
          fi

      - name: Install Researcher
        run: python -m pip install --disable-pip-version-check .

      - name: Run pinned admission and intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIBRARY_GITHUB_TOKEN: ${{ secrets.RESEARCHER_LIBRARY_TOKEN }}
          LIBRARY_REPOSITORY: pilialvu75-hue/AI-Orchestrator-Module-Library
          LIBRARY_REF: main
          DRY_RUN: "false"
          ALLOW_LIBRARY_WRITE: "true"
          DIAGNOSTICS_ENABLED: "true"
          DIAGNOSTICS_GITHUB_TOKEN: ${{ secrets.RESEARCHER_DIAGNOSTICS_TOKEN }}
          DIAGNOSTICS_REPOSITORY: pilialvu75-hue/Ai-orchestrator-diagnostics
          DIAGNOSTICS_INSTANCE_ID: pinned-intake-${{ github.run_id }}-${{ github.run_attempt }}
          RESEARCHER_COMMIT: ${{ github.sha }}
          DATA_DIR: ${{ runner.temp }}/researcher-data
          CAPABILITY: ${{ inputs.capability }}
          UPSTREAM_REPOSITORY: ${{ inputs.repository }}
          UPSTREAM_COMMIT: ${{ inputs.commit }}
          COMPONENT_PATH: ${{ inputs.component_path }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_VERSION: ${{ inputs.source_version }}
          RESCAN: ${{ inputs.rescan }}
        run: |
          set -euo pipefail
          args=(
            admit-pinned
            --capability "$CAPABILITY"
            --repository "$UPSTREAM_REPOSITORY"
            --commit "$UPSTREAM_COMMIT"
          )
          if [[ -n "$COMPONENT_PATH" ]]; then
            args+=(--component-path "$COMPONENT_PATH")
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            args+=(--release-tag "$RELEASE_TAG")
          fi
          if [[ -n "$SOURCE_VERSION" ]]; then
            args+=(--source-version "$SOURCE_VERSION")
          fi
          if [[ "$RESCAN" == "true" ]]; then
            args+=(--rescan)
          fi
          researcher "${args[@]}"

      - name: Preserve sanitized intake diagnostics
        if: ${{ always() }}
        run: |
          set -euo pipefail
          evidence="${RUNNER_TEMP}/intake-diagnostics"
          mkdir -p "$evidence"
          cat > "$evidence/run.json" <<EOF
          {
            "schema": "ai-orchestrator.researcher-intake-run.v1",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "researcher_commit": "${GITHUB_SHA}",
            "capability": "${{ inputs.capability }}",
            "upstream_repository": "${{ inputs.repository }}",
            "upstream_commit": "${{ inputs.commit }}",
            "library_repository": "pilialvu75-hue/AI-Orchestrator-Module-Library",
            "library_ref": "main"
          }
          EOF
          if [[ -d "${RUNNER_TEMP}/researcher-data" ]]; then
            find "${RUNNER_TEMP}/researcher-data" -maxdepth 2 -type f -printf '%P\n' | sort > "$evidence/data-files.txt"
          else
            : > "$evidence/data-files.txt"
          fi

      - name: Upload intake diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pinned-intake-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/intake-diagnostics
          if-no-files-found: error
          retention-days: 30
